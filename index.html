<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>Moov.nl</title>
    <meta name="description" content="Het verhuisplan dat jullie samen bijhouden." />

    <!-- Home-screen app (iOS) -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Moov.nl" />
    <meta name="theme-color" content="#FFFDFA" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-180.png" />
    <link rel="icon" href="%BASE_URL%icon-192.png" />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: #f5f2ec;
        color: #1a1714;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      input,
      textarea,
      select,
      button {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        text-align: left;
      }
      ::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      @keyframes sheetUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
